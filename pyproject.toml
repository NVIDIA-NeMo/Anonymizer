[project]
name = "nemo-anonymizer"
dynamic = ["version"]
description = "NeMo Anonymizer"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"

dependencies = [
    "certifi>=2026.10.19", # Updated CA bundle for the eMudhra compromise
    "data-designer>=1.0.0,<1.1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.12,<3",
    "cyclopts>=3",
    "pygments>=2.20.0",
    "cryptography>=46.0.6",
    "httpx>=0.27.0",
    "huggingface-hub>=1.0.1",
    "jinja2>=3.1.6",
    "pandas>=2.3.3",
    "pyarrow>=24",
    "pyyaml>=6,<7",
    "tiktoken>=0.9.0",
    "regex>=2025.11.3",
]

[project.optional-dependencies]
notebooks = [
    "datasets>=4.0.0,<6",
    "gliner2==2.1.0",
    "ipykernel>=6.29.0,<8",
    "jupyter>=1.0.0,<2",
    "jupytext>=1.16.0,<2",
    "pip>=26.2.2",
    "pillow>=13.0.0,<14",
]

[project.scripts]
anonymizer = "anonymizer.interface.cli.main:main"

[project.entry-points."data_designer.plugins"]
anonymizer-detection-transform = "anonymizer.engine.workflow_columns.detection.plugins:detection_transform_plugin"
anonymizer-chunked-validation = "anonymizer.engine.workflow_columns.detection.plugins:chunked_validation_plugin"
anonymizer-regex-detection = "anonymizer.engine.workflow_columns.detection.plugins:regex_detection_plugin"
anonymizer-augmentation = "anonymizer.engine.workflow_columns.detection.plugins:augmentation_plugin"
anonymizer-evaluation-judge = "anonymizer.engine.workflow_columns.evaluation.judge.plugins:judge_column_plugin"

[dependency-groups]
dev = [
    "fastapi>=0.115,<1",
    "pytest>=9.0.3,<10",
    "pytest-cov>=7.0,<8",
    "ruff==0.17.2",
    "ty==0.0.92",
    "uvicorn>=0.30,<1",
    { include-group = "measurement" },
]
measurement = [
    "wandb[workspaces]>=0.19,<1",
]
docs = [
    "mike>=2.1.3,<3",
    "mkdocs-material",
    "mkdocstrings[python]",
    "griffe-pydantic",
    "mkdocs-gen-files",
    "mkdocs-literate-nav",
    "mkdocs-jupyter",
    "jupytext",
    "markdownify>=1.2,<2",
    "beautifulsoup4>=4,<5",
    "nbconvert>=7,<8",
    "nbformat>=5,<6",
]
[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
fallback-version = "0.0.0"
vcs = "git"
style = "pep440"

[tool.hatch.build.targets.wheel]
packages = ["src/anonymizer"]

[tool.uv]
required-version = "0.13.5"
package = true

constraint-dependencies = [
    "grpcio>=1.68.0", # CVE-2024-11407
    "urllib3>=2.8.0", # GHSA-8988-9cw3-xx77, GHSA-vxq7-64xx-v4gw, GHSA-gh4c-6fx4-qh6g (2.8.0); CVE-2026-44432 (2.7.0)
    "python-dotenv>=1.2.2", # CVE-2026-28684
    "pyjwt>=2.14.0", # GHSA-r6x4-923q-g947, GHSA-ffc3-869f-jxw9, GHSA-p4g4-x82p-q773, GHSA-w2cx-738m-mc7w, GHSA-pxh4-856f-4h89 and others (2.14.0); CVE-2026-48524, CVE-2026-48522, CVE-2026-48525, CVE-2026-48526 (2.13.0)
    "aiohttp>=3.14.4",
    "anyio>=4.14.2",
    "certifi>=2026.10.19",
    "cryptography>=50.0.0",
    "filelock>=4.2.1",
    "idna>=3.15",
    "pillow>=13.0.0",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.31",
    "starlette>=1.3.1",
    "virtualenv>=21.14.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
markers = [
    "e2e: end-to-end tests",
    "integration: integration tests",
]

[tool.coverage.run]
omit = []
