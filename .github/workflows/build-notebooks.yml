name: Build notebooks
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * MON"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.4"
      - name: Set up Python
        run: uv python install 3.11
      - name: Cache pinned GLiNER2 model
        uses: actions/cache@v6
        with:
          # Cache model files only: runtime packages have a platform-specific
          # identity and must not accumulate across ubuntu-latest migrations.
          path: ~/.cache/huggingface/hub
          key: gliner2-model-only-v1-59894c087cb2923b01f337d4ee72f6ff84d5bdd6
      - name: Build notebook wheel
        run: uv build --wheel
      - name: Convert and execute notebooks
        shell: bash
        env:
          # Nested pip installs in the isolated runtime inherit these settings.
          PIP_CONSTRAINT: ${{ github.workspace }}/.github/constraints/notebook-ci.txt
          PIP_FIND_LINKS: https://download.pytorch.org/whl/cpu/torch/
          PIP_NO_CACHE_DIR: "1"
        run: |
          wheel=$(find "$GITHUB_WORKSPACE/dist" -name '*.whl' -print -quit)
          test -n "$wheel"
          make convert-notebooks ANONYMIZER_NOTEBOOK_PACKAGE="${wheel}[notebooks]"
      - name: Upload notebooks as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: notebooks
          path: docs/notebooks
