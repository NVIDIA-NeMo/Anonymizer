# ---------------------------------------------------------------------------
# Release: build wheel, publish to PyPI, and
# optionally create a GitHub release.
#
# Trusted publisher: release.yml with the pypi environment.
# ---------------------------------------------------------------------------

name: "Release NeMo Anonymizer"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run: never publishes to PyPI, creates a release, or deploys docs"
        required: true
        default: true
        type: boolean
      version:
        description: "Branch runs only, and required there: the version to build and validate (for example 0.5.0rc1). Nothing is uploaded."
        required: false
        type: string
      create-gh-release:
        description: Create a GitHub release
        required: true
        default: true
        type: boolean

defaults:
  run:
    shell: bash -x -e -u -o pipefail {0}

permissions:
  contents: read

jobs:
  build-wheel:
    name: Build and verify wheel
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - name: Checkout triggering ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - uses: ./.github/actions/setup-python-env
        with:
          checkout: "false"
          dependency-profile: "runtime"

      - name: Build wheel
        id: build
        env:
          INPUT_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ -n "$INPUT_VERSION" ]; then
              echo "::error::The version input is for branch runs; on a tag the version comes from the tag"
              exit 1
            fi
            case "$GITHUB_REF_NAME" in
              v*) ;;
              *)
                echo "::error::Release tag ${GITHUB_REF_NAME} must start with v"
                exit 1
                ;;
            esac
            VERSION="${GITHUB_REF_NAME#v}"
            mise run build:wheel
            mise run release:verify "$VERSION"
          else
            if [ -z "$INPUT_VERSION" ] || [ "$DRY_RUN" != "true" ]; then
              echo "::error::Running from a branch requires dry-run enabled and the version input"
              exit 1
            fi
            VERSION="$INPUT_VERSION"
            mise run release:check "$VERSION"
          fi
          echo "version=$VERSION" | tee -a "$GITHUB_OUTPUT"
          echo "Built: $(ls dist/*.whl) (version $VERSION)"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nemo-anonymizer-${{ steps.build.outputs.version }}
          path: dist/*.whl
          retention-days: 90

  publish-pypi:
    name: Publish to PyPI
    needs: build-wheel
    if: ${{ github.repository == 'NVIDIA-NeMo/Anonymizer' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && (github.event_name == 'push' || !inputs.dry-run) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/nemo-anonymizer/
    permissions:
      id-token: write
    steps:
      - name: Download verified wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nemo-anonymizer-${{ needs.build-wheel.outputs.version }}
          path: dist/
      - name: Publish with trusted publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  create-gh-release:
    name: Create GitHub release
    permissions:
      contents: write
    needs: [build-wheel, publish-pypi]
    if: ${{ github.event_name == 'push' || (!inputs.dry-run && inputs.create-gh-release) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download wheel artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nemo-anonymizer-${{ needs.build-wheel.outputs.version }}
          path: dist/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
          VERSION: ${{ needs.build-wheel.outputs.version }}
        run: |
          PRERELEASE_FLAG=""
          if echo "$VERSION" | grep -qE '(^|[0-9])rc[0-9]+($|\+)'; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "v${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            dist/*.whl \
            --generate-notes \
            --title "v${VERSION}" \
            --target "$TARGET_SHA" \
            $PRERELEASE_FLAG

  deploy-release-docs:
    name: Deploy release docs
    needs: [build-wheel, publish-pypi, create-gh-release]
    if: ${{ github.event_name == 'push' || (!inputs.dry-run && inputs.create-gh-release) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout triggering ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-python-env
        with:
          checkout: "false"
          dependency-profile: "docs"

      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build docs
        run: mise run docs:build

      - name: Deploy release docs with mike
        env:
          VERSION: ${{ needs.build-wheel.outputs.version }}
        run: mise run docs:deploy "$VERSION"
