# ---------------------------------------------------------------------------
# Release: build wheel, publish to PyPI (or Test PyPI on dry-run), and
# optionally create a GitHub release.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   TEST_PYPI_PERSONAL_TOKEN  – API token scoped to nemo-anonymizer on Test PyPI
#   PYPI_PERSONAL_TOKEN       – API token scoped to nemo-anonymizer on PyPI
# ---------------------------------------------------------------------------

name: "Release NeMo Anonymizer"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run: never publishes to PyPI, creates a release, or deploys docs"
        required: true
        default: true
        type: boolean
      version:
        description: "Branch runs only, and required there: the version to build and validate (for example 0.5.0rc1). Nothing is uploaded."
        required: false
        type: string
      create-gh-release:
        description: Create a GitHub release
        required: true
        default: true
        type: boolean

defaults:
  run:
    shell: bash -x -e -u -o pipefail {0}

permissions:
  contents: write

jobs:
  publish-wheel:
    name: Build and publish wheel
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - name: Checkout triggering ref
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: ./.github/actions/setup-python-env
        with:
          checkout: "false"
          dependency-profile: "runtime"

      - name: Build wheel
        id: build
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ -n "$INPUT_VERSION" ]; then
              echo "::error::The version input is for branch runs; on a tag the version comes from the tag"
              exit 1
            fi
            case "$GITHUB_REF_NAME" in
              v*) ;;
              *)
                echo "::error::Release tag ${GITHUB_REF_NAME} must start with v"
                exit 1
                ;;
            esac
            VERSION="${GITHUB_REF_NAME#v}"
            mise run build:wheel
            mise run release:verify "$VERSION"
          else
            if [ -z "$INPUT_VERSION" ] || [ "${{ inputs.dry-run }}" != "true" ]; then
              echo "::error::Running from a branch requires dry-run enabled and the version input"
              exit 1
            fi
            VERSION="$INPUT_VERSION"
            mise run release:check "$VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Built: $(ls dist/*.whl) (version $VERSION)"

      - uses: actions/upload-artifact@v7
        with:
          name: nemo-anonymizer-${{ steps.build.outputs.version }}
          path: dist/*.whl
          retention-days: 90

      - name: Publish to Test PyPI (pre-flight)
        if: ${{ github.ref_type == 'tag' }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_PERSONAL_TOKEN }}
        run: |
          uvx twine upload \
            --repository-url https://test.pypi.org/legacy/ \
            --skip-existing \
            --non-interactive \
            --verbose \
            dist/*.whl

      - name: Publish to PyPI
        if: ${{ github.ref_type == 'tag' && (github.event_name == 'push' || !inputs.dry-run) }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_PERSONAL_TOKEN }}
        run: |
          uvx twine upload \
            --non-interactive \
            --verbose \
            dist/*.whl

  create-gh-release:
    name: Create GitHub release
    needs: publish-wheel
    if: ${{ github.event_name == 'push' || (!inputs.dry-run && inputs.create-gh-release) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering ref
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download wheel artifact
        uses: actions/download-artifact@v8
        with:
          name: nemo-anonymizer-${{ needs.publish-wheel.outputs.version }}
          path: dist/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
          VERSION: ${{ needs.publish-wheel.outputs.version }}
        run: |
          PRERELEASE_FLAG=""
          if echo "$VERSION" | grep -qE '(^|[0-9])rc[0-9]+($|\+)'; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "v${VERSION}" \
            dist/*.whl \
            --generate-notes \
            --title "v${VERSION}" \
            --target "$TARGET_SHA" \
            $PRERELEASE_FLAG

  deploy-release-docs:
    name: Deploy release docs
    needs: [publish-wheel, create-gh-release]
    if: ${{ github.event_name == 'push' || (!inputs.dry-run && inputs.create-gh-release) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout triggering ref
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-python-env
        with:
          checkout: "false"
          dependency-profile: "docs"

      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build docs
        run: mise run docs:build

      - name: Deploy release docs with mike
        env:
          VERSION: ${{ needs.publish-wheel.outputs.version }}
        run: mise run docs:deploy "$VERSION"
