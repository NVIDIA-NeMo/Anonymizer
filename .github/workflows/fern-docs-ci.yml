name: Fern Docs CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fern-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fern-check:
    name: Fern Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
      - name: Read mise version
        id: mise-version
        shell: bash
        run: |
          python -c 'import tomllib; print("version=" + tomllib.load(open(".mise.toml", "rb"))["min_version"])' >> "$GITHUB_OUTPUT"
      - name: Install Fern tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ steps.mise-version.outputs.version }}
          install_args: node npm:fern-api jq yq
      - name: Validate configuration and MDX
        run: mise run docs:fern:check
