name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # Telemetry is opt-out at runtime; in CI we never want to emit.
  NEMO_TELEMETRY_ENABLED: "false"
  DEFAULT_PYTHON_VERSION: "3.11"

jobs:
  benchmark-task-shell:
    name: Benchmark task (macOS Bash 3.2)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test benchmark task
        run: bash tests/tools/test_benchmark_task.sh

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      # Required to use the reusable action
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: "0"

      - uses: ./.github/actions/setup-python-env
        with:
          checkout: "false"
          fetch-depth: "0"
          python-version: ${{ matrix.python-version }}

      - name: Run tests with coverage
        run: mise run test:coverage

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      # Required to use the reusable action
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: "0"

      - uses: ./.github/actions/setup-python-env
        with:
          checkout: "false"
          fetch-depth: "0"
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}

      - name: Check formatting
        run: mise run check:format

      - name: Check lint rules
        run: mise run check:lint

      - name: Run type checks
        run: mise run check:type

      - name: Check uv.lock is up to date
        run: mise run check:lock

      - name: Check copyright headers
        run: mise run check:license:headers
