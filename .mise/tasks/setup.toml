[setup]
description = "Install the pinned tools, sync every dependency group and extra, and install the repository hooks. Modifies the Mise cache, .venv, and .git/hooks."
run = [
    "mise install",
    { task = "deps:sync", args = ["all"] },
    { task = "hooks:install" },
]

["deps:sync"]
description = "Synchronize one locked dependency profile into .venv or UV_PROJECT_ENVIRONMENT. Removes packages the profile does not name."
usage = '''
arg "[profile]" help="Dependency profile: dev (default groups), all (every group and extra), ci (what CI check and test jobs need), runtime (the package alone), or docs (the dev and docs groups)" default="dev" {
  choices "dev" "all" "ci" "runtime" "docs"
}
'''
run = '''
case "${usage_profile:-dev}" in
  dev) uv sync --locked ;;
  all | ci) uv sync --locked --all-groups --all-extras ;;
  runtime) uv sync --locked --no-default-groups ;;
  docs) uv sync --locked --group dev --group docs ;;
esac
'''

["hooks:install"]
description = "Install the repository-managed pre-commit and commit-message hooks into .git/hooks with prek."
run = "prek install"
