[setup]
description = "Install pinned tools and sync a dependency profile. Developer profiles also install repository hooks; modifies the Mise cache, .venv, and .git/hooks."
usage = '''
arg "[profile]" help="Dependency profile to install" default="dev" {
  choices "runtime" "dev" "docs" "notebooks"
}
flag "--no-hooks" help="Skip hook installation in ephemeral CI environments"
'''
run = [
  "MISE_YES=1 mise trust",
  "MISE_YES=1 mise install",
  { task = "deps:sync", args = ["{{usage.profile}}"] },
  '''
if [ "${usage_profile?}" != "runtime" ] && [ "${usage_no_hooks:-false}" != "true" ]; then
  mise run hooks:install
fi
''',
]

["deps:sync"]
description = "Synchronize one locked dependency profile into .venv or UV_PROJECT_ENVIRONMENT."
usage = '''
arg "[profile]" help="Dependency profile to install" default="dev" {
  choices "runtime" "dev" "docs" "notebooks"
}
'''
run = '''
case "${usage_profile:-dev}" in
  runtime) uv sync --locked --no-default-groups ;;
  dev) uv sync --locked --group dev ;;
  docs) uv sync --locked --group dev --group docs ;;
  notebooks) uv sync --locked --group dev --group notebooks ;;
esac
'''

["hooks:install"]
description = "Install the repository-managed pre-commit and commit-message hooks into .git/hooks."
run = "uv run --locked --group dev pre-commit install"
