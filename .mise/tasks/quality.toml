[format]
description = "Format and safely fix Python, rendered notebooks, and the Python in Markdown with Ruff, Markdown with rumdl, and TOML with dprint. Modifies files in place."
run = [
    "ruff check --fix",
    "ruff format",
    "rumdl check --fix .",
    "dprint fmt",
]

["check:format"]
description = "Check the formatting of Python, rendered notebooks, and the Python in Markdown with Ruff, and of TOML with dprint, without modifying files."
run = [
    "ruff format --check",
    "dprint check",
]

["check:lint"]
description = "Check Ruff rules for Python and rendered notebooks, and Markdown rules with rumdl, without modifying files."
run = [
    "ruff check",
    "rumdl check .",
]

["check:type"]
description = "Run blocking ty checks across source, tests, tools, docs, and rendered notebooks under the root ty.toml."
run = "uv run --locked --group docs ty check --error-on-warning"

["license:headers:fix"]
description = "Add missing SPDX headers to repository files. Modifies files in place."
run = "uv run tools/codestyle/copyright_fixer.py ."

["check:license:headers"]
description = "Check SPDX headers without modifying files."
run = "uv run tools/codestyle/copyright_fixer.py --check ."

["check:lock"]
description = "Verify that the root and serving-runtime lockfiles match their pyproject.toml files."
run = [
    "uv lock --check",
    # The serving runtime pins Python 3.12 in its own .python-version. Drop a CI
    # matrix UV_PYTHON (for example 3.11) so it cannot override that pin.
    "env -u UV_PYTHON uv lock --project tools/inference-service-runtime --check",
]

["lock:update"]
description = "Regenerate uv.lock from project dependency metadata. Modifies uv.lock."
run = "uv lock"

["check:docs:pairs"]
description = "Check that paired docs/**/*.md (MkDocs) and .mdx (Fern) pages change together relative to the target branch."
run = "uv run tools/codestyle/check_docs_pairs.py"

[check]
description = "Run the repository read-only quality checks."
depends = ["check:format", "check:lint", "check:type", "check:lock", "check:license:headers", "check:docs:pairs"]
