# Small model pool for dogfood runs: one local detector plus two chat models
# behind the NVIDIA inference gateway (nvidia-gateway in providers.yaml).
# Swap the chat model aliases/models/provider to point at whatever you want
# to dogfood; keep gliner-pii-detector as-is unless you are running a
# different detector server.
model_configs:
  - alias: gliner-pii-detector
    model: fastino/gliner2-privacy-filter-PII-multi
    provider: local-gliner2
    skip_health_check: true
    inference_parameters:
      max_parallel_requests: 8
      timeout: 120

  - alias: gpt-oss-120b
    # "openai/gpt-oss-120b" returns 403 key_model_access_denied on the
    # inference-api gateway for some keys; "nvcf/openai/gpt-oss-120b" is the
    # operator-verified working ID on that gateway. Model IDs are
    # key/gateway-dependent — see README.md "Model IDs" if this 403s for you.
    model: nvcf/openai/gpt-oss-120b
    provider: nvidia-gateway
    inference_parameters:
      max_parallel_requests: 16
      max_tokens: 16384
      temperature: 0.3
      top_p: 0.95
      timeout: 300

  # Required for the bundled default role mappings: detection's
  # latent_detector and rewrite's evaluator both resolve to this alias
  # unless selected_models overrides them (see
  # src/anonymizer/config/default_model_configs/{detection,rewrite}.yaml).
  - alias: nemotron-30b-thinking
    # "nvidia/nemotron-3-nano-30b-a3b" returns 403 key_model_access_denied on
    # the inference-api gateway for some keys; "nvidia/nvidia/nemotron-3-nano-30b-a3b"
    # is the operator-verified working ID on that gateway. Model IDs are
    # key/gateway-dependent — see README.md "Model IDs" if this 403s for you.
    model: nvidia/nvidia/nemotron-3-nano-30b-a3b
    provider: nvidia-gateway
    inference_parameters:
      max_parallel_requests: 16
      max_tokens: 8192
      temperature: 0.4
      top_p: 1.0
      timeout: 300
