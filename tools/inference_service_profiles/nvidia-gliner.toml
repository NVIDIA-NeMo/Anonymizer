schema_version = "inference-service.local-spec/v2"

[task]
kind = "entity-detection"
dynamic_labels = true
offsets = true
scores = true

[model]
model_id = "nvidia/gliner-pii"
revision = "bd23e8ef4425fd04e34c5204ab49ffaa706eae79"

[vllm]


[vllm.config]
io-processor-plugin = "deberta_gliner_io"
runner = "pooling"
trust-remote-code = true
dtype = "bfloat16"
enable-prefix-caching = false
enable-chunked-prefill = false
gpu-memory-utilization = 0.85
max-model-len = 512
[vllm.factory]
plugin = "deberta_gliner"

[local]
host = "127.0.0.1"
port = 8001

startup_timeout_seconds = 300
shutdown_timeout_seconds = 30
