schema_version = "inference-service.local-spec/v2"

[task]
kind = "entity-detection"
dynamic_labels = true
offsets = true
scores = true

[model]
model_id = "fastino/gliner2-privacy-filter-PII-multi"
revision = "59894c087cb2923b01f337d4ee72f6ff84d5bdd6"

[vllm]


[vllm.config]
io-processor-plugin = "deberta_gliner2_io"
runner = "pooling"
trust-remote-code = true
dtype = "bfloat16"
enable-prefix-caching = false
enable-chunked-prefill = false
gpu-memory-utilization = 0.85
max-model-len = 512
[vllm.factory]
plugin = "deberta_gliner2"

[local]
host = "127.0.0.1"
port = 8002

startup_timeout_seconds = 300
shutdown_timeout_seconds = 30
