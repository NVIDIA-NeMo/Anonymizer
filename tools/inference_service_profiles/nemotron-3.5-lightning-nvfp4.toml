schema_version = "inference-service.local-spec/v2"

[task]
kind = "generation"

[model]
model_id = "nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4"
revision = "cc84af2fe71647d87f4486c064f320e1e7535243"

[vllm]
python_executable = ".venv/bin/python"
served_model_name = "nemotron-3.5-lightning-nvfp4-local"
gpu_memory_utilization = 0.88
max_model_len = 8192
max_num_seqs = 16
enable_prefix_caching = true
async_scheduling = true
mamba_backend = "flashinfer"
mamba_ssm_cache_dtype = "float16"
enable_mamba_cache_stochastic_rounding = true
mamba_cache_philox_rounds = 5

[local]
host = "127.0.0.1"
port = 8000

startup_timeout_seconds = 1800
shutdown_timeout_seconds = 60
