schema_version = "inference-service.spec/v3"
port = 8015
startup_timeout_seconds = 1800
shutdown_timeout_seconds = 60

[backend]
kind = "vllm"
served_model_name = "nemotron-3.5-lightning-nvfp4"

[backend.model]
model_id = "nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4"
revision = "cc84af2fe71647d87f4486c064f320e1e7535243"

[backend.options]
reasoning-parser = "nemotron_v3"
gpu-memory-utilization = 0.88
max-model-len = 8192
max-num-seqs = 16
enable-prefix-caching = true
async-scheduling = true
mamba-backend = "flashinfer"
mamba-ssm-cache-dtype = "float16"
enable-mamba-cache-stochastic-rounding = true
mamba-cache-philox-rounds = 5

[backend.probe_extra_body]
chat_template_kwargs = { enable_thinking = false }
