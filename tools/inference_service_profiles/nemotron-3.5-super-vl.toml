schema_version = "inference-service.spec/v3"
port = 8000
startup_timeout_seconds = 3600
shutdown_timeout_seconds = 120

[backend]
kind = "vllm"
served_model_name = "nemotron-3.5-super-vl-local"

[backend.model]
model_id = "nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-BF16"
revision = "fb0ee0bc6b3f70342afd8d84cb80dbadbaa8a1fe"

[backend.options]
trust-remote-code = true
tensor-parallel-size = 4
reasoning-parser = "nemotron_v3"
gpu-memory-utilization = 0.85
max-model-len = 49152
max-num-seqs = 16
enable-prefix-caching = true
async-scheduling = true
language-model-only = true

[backend.probe_extra_body]
chat_template_kwargs = { enable_thinking = false }
