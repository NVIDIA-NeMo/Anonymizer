schema_version = "inference-service.local-spec/v2"

[task]
kind = "generation"

[model]
model_id = "nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16"
revision = "33268dc8a6da85a56be2b12241453e4e1237bbe1"

[vllm]
served_model_name = "nemotron-3.5-lightning-local"


[vllm.config]
reasoning-parser = "nemotron_v3"
gpu-memory-utilization = 0.88
max-model-len = 8192
max-num-seqs = 16
enable-prefix-caching = true
async-scheduling = true
mamba-backend = "flashinfer"
mamba-ssm-cache-dtype = "float16"
enable-mamba-cache-stochastic-rounding = true
mamba-cache-philox-rounds = 5
[local]
host = "127.0.0.1"
port = 8000

startup_timeout_seconds = 1800
shutdown_timeout_seconds = 60
