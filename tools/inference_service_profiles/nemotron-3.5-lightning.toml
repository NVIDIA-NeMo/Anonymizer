schema_version = "inference-service.intent/v1"

[task]
kind = "generation"
chat = true

[model]
kind = "hugging-face"
model_id = "nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16"
revision = "33268dc8a6da85a56be2b12241453e4e1237bbe1"

[engine]
kind = "vllm"
python_executable = ".venv/bin/python"
served_model_name = "nemotron-3.5-lightning-local"
gpu_memory_utilization = 0.88
max_model_len = 8192
max_num_seqs = 16
enable_prefix_caching = true
async_scheduling = true
mamba_backend = "flashinfer"
mamba_ssm_cache_dtype = "float16"
enable_mamba_cache_stochastic_rounding = true
mamba_cache_philox_rounds = 5

[placement]
kind = "local-process"
host = "127.0.0.1"
port = 8000

[access]
kind = "direct"

[lifecycle]
kind = "managed"
startup_timeout_seconds = 1800
shutdown_timeout_seconds = 60
