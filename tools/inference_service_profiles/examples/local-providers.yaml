# Providers for local-models.yaml: one per running server, named local-<profile>
# and listening on that profile's port. The shipped profiles do not
# authenticate requests, so api_key is a placeholder.

providers:
  - name: local-gliner2
    endpoint: http://127.0.0.1:8001/v1
    provider_type: openai
    api_key: EMPTY

