# Example role configuration served entirely by local profiles.
# Each provider is one server launched from tools/inference_service_profiles/:
#   local-gliner               gliner2-native.toml
#   local-gemma-4-26b          gemma-4-26b-a4b-it.toml
#   local-qwen3.8-27b          qwen3.8-27b.toml
#   local-nemotron-lightning   nemotron-3.5-lightning.toml
#   local-nemotron-super-vl    nemotron-3.5-super-vl.toml
#   local-gpt-oss-120b         gpt-oss-120b.toml
# vLLM ignores OpenRouter's `reasoning` and `provider` fields; thinking is
# switched with chat_template_kwargs.enable_thinking instead.

model_configs:
  - alias: gliner-pii-detector
    model: fastino/gliner2-privacy-filter-PII-multi
    provider: local-gliner
    inference_parameters: { max_parallel_requests: 1, timeout: 120 }

  - alias: gemma-4-26b
    model: gemma-4-26b-a4b-it-local
    provider: local-gemma-4-26b
    inference_parameters:
      max_parallel_requests: 16
      max_tokens: 32768
      temperature: 1.0
      top_p: 0.95
      timeout: 300
      extra_body:
        top_k: 64

  - alias: gemma-4-26b-entity-classification
    model: gemma-4-26b-a4b-it-local
    provider: local-gemma-4-26b
    inference_parameters:
      max_parallel_requests: 16
      max_tokens: 2048
      temperature: 0.0
      top_p: 0.95
      timeout: 300
      extra_body:
        top_k: 64
        chat_template_kwargs:
          enable_thinking: false

  - alias: nemotron-3.5-lightning-disposition
    model: nemotron-3.5-lightning-local
    provider: local-nemotron-lightning
    inference_parameters:
      max_parallel_requests: 8
      max_tokens: 16384
      temperature: 0.1
      top_p: 0.95
      timeout: 300
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - alias: nemotron-3.5-super-vl
    model: nemotron-3.5-super-vl-local
    provider: local-nemotron-super-vl
    inference_parameters:
      max_parallel_requests: 16
      max_tokens: 32768
      temperature: 1.0
      top_p: 0.95
      timeout: 300
      extra_body:
        chat_template_kwargs:
          enable_thinking: true

  - alias: nemotron-3.5-lightning-thinking
    model: nemotron-3.5-lightning-local
    provider: local-nemotron-lightning
    inference_parameters:
      max_parallel_requests: 16
      max_tokens: 32768
      temperature: 1.0
      top_p: 0.95
      timeout: 300
      extra_body:
        chat_template_kwargs:
          enable_thinking: true

  - alias: qwen-3.8-27b
    model: qwen3.8-27b-local
    provider: local-qwen3.8-27b
    inference_parameters:
      max_parallel_requests: 16
      max_tokens: 16384
      temperature: 0.7
      top_p: 0.80
      timeout: 300
      extra_body:
        top_k: 20
        min_p: 0.0
        presence_penalty: 1.5
        repetition_penalty: 1.0
        chat_template_kwargs:
          enable_thinking: false

  - alias: gpt-oss-120b
    model: gpt-oss-120b-local
    provider: local-gpt-oss-120b
    inference_parameters:
      max_parallel_requests: 16
      max_tokens: 16384
      temperature: 0.3
      top_p: 0.95
      timeout: 300

selected_models:
  detection:
    entity_detector: gliner-pii-detector
    entity_validator: qwen-3.8-27b
    entity_augmenter: gemma-4-26b
    latent_detector: nemotron-3.5-lightning-thinking
  replace:
    replacement_generator: gemma-4-26b
  rewrite:
    domain_classifier: gemma-4-26b
    entity_classifier: gemma-4-26b-entity-classification
    disposition_analyzer: nemotron-3.5-super-vl
    meaning_extractor: gemma-4-26b
    qa_generator: gemma-4-26b
    rewriter: qwen-3.8-27b
    evaluator: nemotron-3.5-lightning-thinking
    repairer: qwen-3.8-27b
  evaluate:
    entity_coverage_judge: gemma-4-26b
    detection_validity_judge: gemma-4-26b
    replace_type_fidelity_judge: gemma-4-26b
    replace_relational_consistency_judge: gemma-4-26b
    replace_attribute_fidelity_judge: gemma-4-26b
    rewrite_judge: nemotron-3.5-lightning-thinking
