[project]
name = "nemo-anonymizer-relay-service-environment"
version = "0.1.0"
description = "Locked runtime environment for the NeMo Anonymizer Relay exporter"
requires-python = ">=3.11,<3.12"
dependencies = [
    "nemo-anonymizer",
    "nemo-anonymizer-relay",
    # Data Designer currently requires this matching OpenTelemetry beta line.
    "opentelemetry-exporter-prometheus==0.64b0",
    "opentelemetry-semantic-conventions==0.64b0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "ty==0.0.69",
]

[tool.uv]
required-version = ">=0.5.0"
package = false
prerelease = "explicit"
constraint-dependencies = [
    "grpcio>=1.68.0",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
    "urllib3>=2.7.0",
]

[tool.uv.sources]
nemo-anonymizer = {path = "../../..", editable = true}
nemo-anonymizer-relay = {path = "..", editable = true}
