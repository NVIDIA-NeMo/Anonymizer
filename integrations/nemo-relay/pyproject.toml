[project]
name = "nemo-anonymizer-relay"
version = "0.1.0"
description = "Protected NeMo Anonymizer observability exporter for NeMo Relay"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
dependencies = [
    "nemo-relay-plugin==0.9.0",
]

[project.urls]
repository = "https://github.com/NVIDIA-NeMo/Anonymizer"
documentation = "https://nvidia-nemo.github.io/Anonymizer/"
issues = "https://github.com/NVIDIA-NeMo/Anonymizer/issues"

[dependency-groups]
test = [
    "pandas>=2.2,<3",
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.12.3,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nemo_anonymizer_relay"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
extend = "../../ruff.toml"

[tool.ruff.lint.isort]
known-first-party = ["anonymizer", "nemo_anonymizer_relay"]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.environment]
python-version = "3.11"
root = ["src", "tests"]

[tool.uv]
required-version = ">=0.5.0"
package = true
