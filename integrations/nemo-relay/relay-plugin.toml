manifest_version = 1

[plugin]
id = "nvidia.nemo_anonymizer"
kind = "worker"

[compat]
relay = ">=0.9.1,<1.0"
worker_protocol = "grpc-v1"

[defaults]
enabled = false

[capabilities]
items = ["plugin_worker", "config_schema"]

[config_schema]
path = "config.schema.json"

[source]
manifest_root = "."
artifact = "nemo_anonymizer_relay/worker.py"

[integrity]
sha256 = "sha256:<artifact-sha256>"

[load]
runtime = "python"
entrypoint = "nemo_anonymizer_relay.worker:main"
