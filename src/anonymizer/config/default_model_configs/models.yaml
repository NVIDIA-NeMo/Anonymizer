model_configs:
  - alias: nemotron-super
    model: nvidia/nemotron-3-super-120b-a12b
    provider: nvidia
    inference_parameters:
      max_parallel_requests: 16
      max_tokens: 16384
      temperature: 0.3
      top_p: 0.95
      timeout: 300
      extra_body:
        reasoning_effort: none
        chat_template_kwargs:
          enable_thinking: false
