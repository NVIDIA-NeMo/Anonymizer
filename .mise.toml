# Tool versions managed by mise (https://mise.jdx.dev/).
# Run `mise install` to install all tools.
min_version = "2026.11.3"

[tools]
uv = "0.13.5"
ruff = "0.17.2"
ty = "0.0.92"
# Fern documentation tooling. jq and yq are dependencies of docs:fern:check.
jq = "1.8.1"
yq = "4.44.1"
# Keep the Fern version aligned with docs/fern/fern.config.json.
# fern-api is a wrapper; fern.config.json selects the CLI version it executes.
node = "22"
"npm:fern-api" = "5.201.0"
python = "3.13.17"
dprint = "0.64.3"
rumdl = "0.3.0"
prek = "0.5.10"

[env]
_.file = [".env", { path = ".env.local", redact = true }]

[task_config]
includes = [".mise/tasks", ".mise/tasks/*.toml"]

[settings]
lockfile = true
minimum_release_age = "7d"
lockfile_platforms = ["macos-arm64", "linux-x64", "linux-arm64"]
idiomatic_version_file_enable_tools = []
python.uv_venv_auto = "source"
